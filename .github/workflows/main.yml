
name: Deploy Liger Gym Backend

on:
  push:
    branches:
      - master

jobs:
  deploy_production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect with VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            mkdir -p ~/apps/ligergym-backend
            cd ~/apps/ligergym-backend

            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git stash
              git pull origin master
            else
              echo "Cloning backend repository..."
              git clone -b master https://github.com/yonathanth/liger-gym-api.git .
            fi

            echo "Installing dependencies..."
            npm install --force

            echo "Generating Prisma client..."
            npx prisma generate

            echo "Updating database schema..."
            npx prisma db push

            echo "Building backend..."
            npm run build

            echo "Starting/reloading backend on port 4040..."
            if pm2 describe ligergym-backend > /dev/null 2>&1; then
              PORT=4040 pm2 restart ligergym-backend --update-env
            else
              PORT=4040 pm2 start npm --name "ligergym-backend" -- start
            fi

            pm2 save
